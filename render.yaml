databases:
  - name: review-scraper-db
    databaseName: discovery_engine
    user: db_user
    region: ohio

services:
  - type: web
    name: review-scraper-backend
    env: python
    region: ohio
    rootDir: backend
    buildCommand: "sed -i '/app-store-scraper/d' requirements.txt && pip install -r requirements.txt && pip install app-store-scraper==0.3.5 --no-deps"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: review-scraper-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CHROMADB_PATH
        value: /data/chroma
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: chroma-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: review-scraper-frontend
    env: node
    region: ohio
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: review-scraper-backend
          envVarKey: RENDER_EXTERNAL_URL
