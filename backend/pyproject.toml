[tool.poetry]
name = "discovery-engine-backend"
version = "0.1.0"
description = "AI-Powered Fashion Purchase Discovery Intelligence Engine"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.29.0"
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
aiosqlite = "^0.20.0"
pydantic-settings = "^2.2.1"
chromadb = "^0.5.0"
sentence-transformers = "^2.7.0"
groq = "^0.8.0"
langdetect = "^1.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
ruff = "^0.4.4"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
